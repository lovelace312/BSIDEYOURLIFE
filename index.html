<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>B-Side</title>
  <meta name="description" content="Capture a photo stamped with the song you're playing, where you are, and when." />

  <!-- PWA / iOS home-screen setup -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#0b0b12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="B-Side" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1 class="logo">B&#8209;Side</h1>
      <button id="spotifyBtn" class="chip" type="button">Connect Spotify</button>
    </header>

    <!-- The live "now playing" card. This is also what we render to save. -->
    <section id="liveCard" class="card">
      <div class="art">
        <video id="preview" class="preview" autoplay playsinline muted></video>
        <button id="flipBtn" class="flip" type="button" aria-label="Flip camera">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 6v3l4-4-4-4v3c-4.42 0-8 3.58-8 8 0 1.57.46 3.03 1.24 4.26L6.7 14.8c-.45-.83-.7-1.79-.7-2.8 0-3.31 2.69-6 6-6zm6.76 1.74L17.3 9.2c.44.84.7 1.79.7 2.8 0 3.31-2.69 6-6 6v-3l-4 4 4 4v-3c4.42 0 8-3.58 8-8 0-1.57-.46-3.03-1.24-4.26z"/></svg>
        </button>
      </div>

      <div class="meta">
        <div id="npTitle" class="title">No song</div>
        <div id="npArtist" class="artist">&mdash;</div>
        <div id="npAlbum" class="album">&mdash;</div>

        <!-- Decorative player controls (they set the "music app" mood) -->
        <div class="progress"><span class="bar"></span></div>
        <div class="player">
          <button class="pbtn" type="button" aria-hidden="true" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM18 6v12l-9-6z"/></svg>
          </button>
          <button id="captureBtn" class="pbtn play" type="button" aria-label="Take photo">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="pbtn" type="button" aria-hidden="true" tabindex="-1">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6v12l9-6z"/></svg>
          </button>
        </div>

        <div id="metaLine" class="metaLine">Locating&hellip;</div>
      </div>
    </section>

    <!-- The finished, saveable image is drawn here -->
    <canvas id="canvas" class="result" hidden></canvas>

    <!-- Manual song entry (used when Spotify has nothing / not connected) -->
    <section id="manualSong" class="manualSong" hidden>
      <input id="manualTitle" type="text" placeholder="Song title" />
      <input id="manualArtist" type="text" placeholder="Artist" />
      <input id="manualAlbum" type="text" placeholder="Album (optional)" />
    </section>

    <p id="status" class="status">Tap the play button to capture.</p>

    <div id="afterShot" class="afterShot" hidden>
      <button id="retakeBtn" class="secondary" type="button">Retake</button>
      <button id="saveBtn" class="primary" type="button">Save / Share</button>
    </div>

    <!-- Hidden file input: fallback if live camera isn't available -->
    <input id="fileInput" type="file" accept="image/*" capture="environment" hidden />
  </main>

  <script src="js/config.js"></script>
  <script src="js/spotify.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
